<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="奏祐ホーム">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>奏祐ホーム</title>
<style>
:root{--blue:#1a73e8;--yel:#f9ab00;--red:#d93025;--green:#188038;--bg:#f1f3f4;--ink:#202124;--sub:#5f6368}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;padding-bottom:84px}
header{background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;position:sticky;top:0;z-index:5;box-shadow:0 1px 2px #0002}
h1{font-size:22px;margin:0}.sub{font-size:12.5px;color:var(--sub)}
main{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px #0002}
.h{font-weight:800;font-size:15px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eee;font-size:15px}.row:first-of-type{border-top:0}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:10px;color:#fff;margin-left:auto;white-space:nowrap}
.b{background:var(--blue)}.y{background:var(--yel);color:#3c2e00}.r{background:var(--red)}.g{background:#9aa0a6}
.bar{height:12px;border-radius:6px;background:#e3e6ea;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px}
button{font:inherit;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;color:#fff;background:var(--blue);width:100%}
button.sec{background:#e8eaed;color:var(--ink)}button:disabled{opacity:.45}
.mk{display:flex;gap:6px;margin-left:auto}.mk button{width:44px;height:44px;border-radius:50%;padding:0;font-size:19px;background:#fff;color:#9aa0a6;border:2px solid #cfd3d8}
.mk button.on0{background:var(--blue);border-color:var(--blue);color:#fff}.mk button.on1{background:var(--yel);border-color:var(--yel);color:#3c2e00}.mk button.on2{background:var(--red);border-color:var(--red);color:#fff}
textarea,input{font:inherit;width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav a{flex:1;text-align:center;font-size:10px;color:var(--sub);padding:4px 0}nav a b{display:block;font-size:21px}nav a.on{color:var(--blue);font-weight:800}
.banner{background:#fff4e5;border:1px solid #f9ab00;border-radius:12px;padding:10px 12px;font-size:13px;color:#5f4300}
</style>
</head>
<body>
<header><h1 id="ttl">奏祐ホーム</h1><div class="sub" id="sub"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
"use strict";
var APP_V = "0.9";
/* 自動更新：新しい版が出ていたら、自分で読み直す（ホーム画面のアプリを入れ直さなくてよい） */
(function(){
  try{
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
      if(j&&j.v&&j.v!==APP_V&&location.search!=="?v="+encodeURIComponent(j.v)){location.replace(location.pathname+"?v="+encodeURIComponent(j.v))}
    }).catch(function(){});
  }catch(e){}
})();
var LS = {get:function(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var cfg = {url: LS.get("sh_url"), token: LS.get("sh_token"), who: LS.get("sh_who")};
var demo = !(cfg.url && cfg.token);
var tab = "home";

/* ---------- デモ用のサンプル（本物のデータではありません） ---------- */
var DEMO = {
  understanding: [
    {"科目":"算数","単元":"サンプル単元A","★":3,"確認状態":"要確認"},
    {"科目":"算数","単元":"サンプル単元B","★":2.5,"確認状態":"要確認"},
    {"科目":"算数","単元":"サンプル単元C","★":3,"確認状態":"要確認"},
    {"科目":"漢字","単元":"サンプル単元D","★":2,"確認状態":"要確認"}],
  plan: [
    {"番号":"①","内容":"サンプル問題1"},{"番号":"②","内容":"サンプル問題2"},{"番号":"③","内容":"サンプル問題3"}]
};

function api(action, extra){
  if(demo) return Promise.resolve({ok:true, rows: DEMO[action]||[]});
  var body = Object.assign({action:action, token:cfg.token}, extra||{});
  return fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)})
    .then(function(r){return r.json()}).catch(function(){return {ok:false,error:"net"}});
}
function shrink(file,max){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.82).split(",")[1])};img.onerror=function(){rej()};img.src=u})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function tagOf(s){return /要確認|注意/.test(s)?"y":/満点|OK|済/.test(s)?"b":"g"}
function banner(){return demo?'<div class="banner">デモ表示です（サンプルの数字。まだ本物のデータにつながっていません）</div>':""}

function nav(){
  var t=[["home","🏠","ホーム"],["cal","📅","予定"],["ans","📖","答え"],["und","📊","理解度"],["rec","📝","記録"],["pho","📷","写真"],["more","⋯","もっと"]];
  document.getElementById("nav").innerHTML=t.map(function(x){return '<a href="#" data-t="'+x[0]+'" class="'+(tab===x[0]?"on":"")+'"><b>'+x[1]+'</b>'+x[2]+'</a>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("nav a"),function(a){a.onclick=function(e){e.preventDefault();tab=a.getAttribute("data-t");render()}});
}
function render(){
  nav();
  var m=document.getElementById("main"), ttl=document.getElementById("ttl"), sub=document.getElementById("sub");
  if(tab==="home"){
    ttl.textContent="奏祐ホーム"; sub.textContent=today();
    m.innerHTML=banner()+'<div class="card"><div class="h">次の自習学習</div><div class="sub">金曜に依頼 → 出題レビュー → Go → PDF → 印刷</div></div><div class="card"><div class="h">いま気をつけたいところ</div><div id="warn">読み込み中…</div></div>';
    api("understanding").then(function(r){
      var rows=(r.rows||[]).filter(function(x){return /要確認/.test(x["確認状態"])});
      document.getElementById("warn").innerHTML=r.ok?(rows.map(function(x){return '<div class="row">'+esc(x["単元"])+'<span class="tag y">'+esc(x["確認状態"])+'</span></div>'}).join("")||'<div class="sub">いまは特にありません</div>'):'<div class="sub">読み込めませんでした（「もっと」で接続を確認）</div>';
    });
  } else if(tab==="cal"){
    ttl.textContent="自学カレンダー"; sub.textContent="自学は『休みの日』だけ。休みで未作成の日は赤い点線";
    m.innerHTML=banner()+'<div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><button class="sec" id="pm" style="width:52px;padding:8px">◀</button><div class="h" id="mt" style="margin:0"></div><button class="sec" id="nm" style="width:52px;padding:8px">▶</button></div><div id="cg" style="margin-top:10px"></div><div class="sub" style="margin-top:8px">休＝土日・祝日・休校などの休みの日　📄作成ずみ　📷写真　✅記録</div></div><div class="card" id="cd"><div class="sub">日付をタップすると、くわしく出ます</div></div>';
    var cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),1);var st={made:[],photos:[],records:[]},evs={},calOk=null;
    function ymd(y,mo,d){return y+"-"+("0"+(mo+1)).slice(-2)+"-"+("0"+d).slice(-2)}
    var OFF=/休校|休み|代休|振替休|休業|県民の日/;
    function isOff(k,w){if(w==0||w==6)return true;return (evs[k]||[]).some(function(e){return e.kind==="holiday"||OFF.test(e.title)})}
    function grid(){
      var y=cur.getFullYear(),mo=cur.getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate(),t=today();
      document.getElementById("mt").textContent=y+"年"+(mo+1)+"月";
      var h='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px">'+["日","月","火","水","木","金","土"].map(function(w,i){return '<div style="color:'+(i==0?"var(--red)":i==6?"var(--blue)":"var(--sub)")+';font-weight:800">'+w+'</div>'}).join("");
      for(var i=0;i<first;i++)h+="<div></div>";
      for(var d=1;d<=days;d++){
        var k=ymd(y,mo,d),w=(first+d-1)%7,off=isOff(k,w),mk=st.made.indexOf(k)>=0,ph=st.photos.indexOf(k)>=0,rc=st.records.indexOf(k)>=0;
        var bd=k===t?"2px solid var(--blue)":(off&&!mk?"1px dashed #f2a099":"1px solid #eee");
        var mark=off?((mk?"📄":"")+(ph?"📷":"")+(rc?"✅":"")+(!mk?'<span style="color:#d93025;font-weight:800">休</span>':"")):"";
        h+='<div data-k="'+k+'" data-w="'+w+'" style="border:'+bd+';border-radius:8px;padding:3px 0;min-height:52px;background:'+(off&&mk?"#e8f0fe":"#fff")+'"><div style="font-weight:800;color:'+(w==0?"var(--red)":w==6?"var(--blue)":"var(--ink)")+'">'+d+'</div><div style="font-size:11px;line-height:1.2">'+mark+'</div></div>';
      }
      document.getElementById("cg").innerHTML=h+"</div>";
      Array.prototype.forEach.call(document.querySelectorAll("#cg [data-k]"),function(el){el.onclick=function(){
        var k=el.getAttribute("data-k"),w=Number(el.getAttribute("data-w")),off=isOff(k,w),a=[];
        var es=(evs[k]||[]).filter(function(e){return !/Meet\)?$/.test(e.title)});
        if(es.length)a.push('<b>カレンダー</b><br>'+es.slice(0,8).map(function(e){return esc((e.time?e.time+" ":"")+e.title)}).join("<br>")+(es.length>8?"<br>ほか"+(es.length-8)+"件":""));
        if(off){
          a.push(st.made.indexOf(k)>=0?"📄 自学プリントは、作成ずみです（「答え」で見られます）":"📄 休みの日です。自学プリントは、まだ作っていません");
          if(st.photos.indexOf(k)>=0)a.push("📷 写真が保存されています");
          if(st.records.indexOf(k)>=0)a.push("✅ 答え合わせの記録があります");
        }
        if(calOk===false)a.push('<span class="sub">（カレンダーはまだ読み込めていません）</span>');
        document.getElementById("cd").innerHTML='<div class="h">'+esc(k)+(off?"（休みの日）":"")+'</div><div style="line-height:1.8;font-size:14px">'+(a.join("<br><br>")||'<span class="sub">予定はありません</span>')+'</div>';
      }});
    }
    function load(){
      grid();
      if(demo)return;
      var y=cur.getFullYear(),mo=cur.getMonth(),nx=new Date(y,mo+1,1);
      api("status").then(function(r){if(r&&r.ok){st=r;grid()}});
      api("calendar",{from:ymd(y,mo,1),to:ymd(nx.getFullYear(),nx.getMonth(),1)}).then(function(r){
        calOk=!!(r&&r.ok);
        if(r&&r.ok){(r.events||[]).forEach(function(e){(evs[e.date]=evs[e.date]||[]).push(e)})}
        grid();
      });
    }
    document.getElementById("pm").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);load()};
    document.getElementById("nm").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);load()};
    load();
  } else if(tab==="ans"){
    ttl.textContent="自学の答え"; sub.textContent="保護者用（奏祐には見せません）";
    m.innerHTML=banner()+'<div class="card" id="al">読み込み中…</div><div id="av"></div>';
    api("answerList").then(function(r){
      var al=document.getElementById("al");
      if(demo){al.innerHTML='<div class="sub">デモ表示では、答えは出ません（接続すると、日付ごとの答えが出ます）</div>';return}
      if(!r.ok){al.innerHTML='<div class="sub">読み込めませんでした</div>';return}
      var rows=r.rows||[];
      al.innerHTML='<div class="h">日付をえらぶ</div>'+(rows.length?rows.map(function(x,i){var w="日月火水木金土"[new Date(x.date+"T00:00:00").getDay()];return '<div class="row" data-i="'+i+'" style="cursor:pointer"><b>'+esc(x.date.slice(5).replace("-","/"))+'（'+w+'）</b><span class="tag b">答えを見る</span></div>'}).join(""):'<div class="sub">まだ答えがありません</div>');
      Array.prototype.forEach.call(al.querySelectorAll(".row"),function(el){el.onclick=function(){
        var x=rows[Number(el.getAttribute("data-i"))],av=document.getElementById("av");
        av.innerHTML='<div class="card"><div class="sub">読み込み中…（少し時間がかかります）</div></div>';
        api("answerImage",{id:x.id}).then(function(q){
          av.innerHTML=q.ok?'<div class="card"><div class="h">'+esc(x.date)+' の答え</div><img style="width:100%;border-radius:8px" src="data:image/jpeg;base64,'+q.data+'"><div class="sub" style="margin-top:6px">拡大するときは、指で広げてください</div></div>':'<div class="card"><div class="sub">読み込めませんでした</div></div>';
          av.scrollIntoView({behavior:"smooth"});
        });
      }});
    });
  } else if(tab==="und"){
    ttl.textContent="理解度"; sub.textContent="★1〜5（暫定）。単発の結果では決めません";
    m.innerHTML=banner()+'<div class="card" id="und">読み込み中…</div>';
    api("understanding").then(function(r){
      var by={};(r.rows||[]).forEach(function(x){(by[x["科目"]]=by[x["科目"]]||[]).push(x)});
      var h=Object.keys(by).map(function(k){return '<div class="h" style="margin-top:8px">'+esc(k)+'</div>'+by[k].map(function(x){
        var s=Number(x["★"])||0,c=/要確認/.test(x["確認状態"])?"var(--yel)":"var(--blue)";
        return '<div class="row" style="display:block"><div style="display:flex;align-items:center">'+esc(x["単元"])+'<span class="tag '+tagOf(x["確認状態"])+'">'+esc(x["確認状態"])+'</span></div><div class="bar"><i style="width:'+(s/5*100)+'%;background:'+c+'"></i></div></div>'}).join("")}).join("");
      document.getElementById("und").innerHTML=r.ok?(h||'<div class="sub">データがありません</div>'):'<div class="sub">読み込めませんでした</div>';
    });
  } else if(tab==="rec"){
    ttl.textContent="答え合わせの記録"; sub.textContent="直させる前の状態で、○△×をタップ";
    m.innerHTML=banner()+'<div class="card"><button disabled>📷 ノートを撮影する（次の段階）</button></div><div class="card" id="plan">読み込み中…</div><div class="card"><div class="h">ひとこと</div><textarea id="memo" rows="3" placeholder="どこで迷っていた？"></textarea></div><button id="save">保存する</button><div class="sub" id="msg" style="text-align:center"></div>';
    var sel={};
    api("plan",{date:today()}).then(function(r){
      var rows=r.rows||[];
      document.getElementById("plan").innerHTML='<div class="h">問題ごとの結果</div>'+(rows.length?rows.map(function(x,i){return '<div class="row">'+esc(x["番号"])+" "+esc(x["内容"])+'<div class="mk" data-i="'+i+'"><button data-v="0">○</button><button data-v="1">△</button><button data-v="2">×</button></div></div>'}).join(""):'<div class="sub">今日の問題はまだ登録されていません</div>');
      Array.prototype.forEach.call(document.querySelectorAll(".mk button"),function(b){b.onclick=function(){var i=b.parentNode.getAttribute("data-i");sel[i]=Number(b.getAttribute("data-v"));Array.prototype.forEach.call(b.parentNode.children,function(c){c.className=""});b.className="on"+sel[i]}});
      document.getElementById("save").onclick=function(){
        var items=Object.keys(sel).map(function(i){return {no:rows[i]["番号"],result:["○","△","×"][sel[i]],memo:document.getElementById("memo").value}});
        var msg=document.getElementById("msg");
        if(!items.length){msg.textContent="○△×を選んでください";return}
        if(demo){msg.textContent="デモなので保存しません（接続すると保存されます）";return}
        api("addRecord",{date:today(),items:items,who:cfg.who}).then(function(r){msg.textContent=r.ok?"保存しました":"保存できませんでした"});
      };
    });
  } else if(tab==="pho"){
    ttl.textContent="写真を保存"; sub.textContent="自学は『プリント＋ノート』をいっしょに保存";
    m.innerHTML=banner()+'<div class="card"><div class="h">種類</div><div style="display:flex;gap:8px"><button class="sec on" id="k1" style="flex:1">自学</button><button class="sec" id="k2" style="flex:1">学校のテスト</button></div><div style="height:10px"></div><div class="h">日付（その日のプリントの日付）</div><input id="pd" type="date" value="'+today()+'"><div style="height:10px"></div><div class="h">ひとこと（任意）</div><input id="pn" placeholder="例：算数 がい数"></div><div id="slots"></div><button id="ps" disabled>まとめて保存する</button><div class="sub" id="pm" style="text-align:center;margin-top:6px"></div>';
    var kind="study",files={};
    var PARTS={study:[["print","① 自学プリント（問題）"],["note","② 自学ノート（奏祐の答え）"]],test:[["front","① テスト（表）"],["back","② テスト（裏）"]]};
    function paint(){
      var k1=document.getElementById("k1"),k2=document.getElementById("k2");
      k1.style.background=kind==="study"?"var(--blue)":"";k1.style.color=kind==="study"?"#fff":"";
      k2.style.background=kind==="test"?"var(--blue)":"";k2.style.color=kind==="test"?"#fff":"";
      document.getElementById("slots").innerHTML=PARTS[kind].map(function(p){var has=!!files[p[0]];
        return '<div class="card"><div class="h">'+p[1]+(has?' ✅':'')+'</div><input type="file" accept="image/*" capture="environment" data-p="'+p[0]+'" style="display:none"><button class="'+(has?"sec":"")+'" data-c="'+p[0]+'" style="background:'+(has?"":"#188038")+'">📷 '+(has?"撮りなおす":"撮影する／写真を選ぶ")+'</button>'+(has?'<img style="width:100%;border-radius:10px;margin-top:10px" src="data:image/jpeg;base64,'+files[p[0]]+'">':"")+'</div>'}).join("");
      Array.prototype.forEach.call(document.querySelectorAll("#slots button"),function(b){b.onclick=function(){document.querySelector('#slots input[data-p="'+b.getAttribute("data-c")+'"]').click()}});
      Array.prototype.forEach.call(document.querySelectorAll("#slots input"),function(inp){inp.onchange=function(){var f=inp.files&&inp.files[0],p=inp.getAttribute("data-p");if(!f)return;shrink(f,1800).then(function(d){files[p]=d;paint()},function(){document.getElementById("pm").textContent="写真を読み込めませんでした"})}});
      document.getElementById("ps").disabled=!Object.keys(files).length;
    }
    document.getElementById("k1").onclick=function(){kind="study";files={};paint()};document.getElementById("k2").onclick=function(){kind="test";files={};paint()};
    paint();
    document.getElementById("ps").onclick=function(){
      var btn=this,msg=document.getElementById("pm");
      if(demo){msg.textContent="デモなので保存しません（接続すると保存されます）";return}
      var keys=Object.keys(files),setId=String(Date.now()).slice(-8),done=0,fail=0;
      btn.disabled=true;msg.textContent="保存中…（"+keys.length+"枚）";
      keys.reduce(function(pr,pk){return pr.then(function(){return api("uploadPhoto",{kind:kind,part:pk,set:setId,date:document.getElementById("pd").value,note:document.getElementById("pn").value,data:files[pk],who:cfg.who}).then(function(r){if(r.ok)done++;else fail++})})},Promise.resolve()).then(function(){
        msg.textContent=fail?("一部保存できませんでした（成功"+done+"枚・失敗"+fail+"枚）"):("保存しました（"+done+"枚）");
        if(!fail){files={};paint();btn.disabled=true}else{btn.disabled=false}
      });
    };
  } else {
    ttl.textContent="もっと"; sub.textContent="接続の設定";
    m.innerHTML=banner()+'<div class="card"><div class="h">接続の設定（最初の1回）</div><div class="sub">スプレッドシート側のURLと合言葉を入れます。合言葉は、このスマホの中にだけ保存されます。</div><div style="height:8px"></div><input id="u" placeholder="接続URL" value="'+esc(cfg.url)+'"><div style="height:8px"></div><input id="t" type="password" placeholder="'+(cfg.token?"保存済み（変えるときだけ入力）":"合言葉")+'" value=""><div style="height:8px"></div><input id="w" placeholder="入力者（例：パパ／あっちゃん）" value="'+esc(cfg.who)+'"><div style="height:12px"></div><button id="go">保存して接続する</button><div class="sub" id="cm" style="margin-top:8px">'+(demo?"状態：未接続（デモ表示）":"状態：接続の設定が保存されています")+'</div></div><div class="sub" style="text-align:center">画面のバージョン：'+APP_V+'（自動で更新されます）</div>';
    document.getElementById("go").onclick=function(){
      var u=document.getElementById("u").value.trim(),t=document.getElementById("t").value.trim()||cfg.token;
      LS.set("sh_url",u);LS.set("sh_token",t);LS.set("sh_who",document.getElementById("w").value.trim());
      cfg={url:u,token:t,who:LS.get("sh_who")};demo=!(cfg.url&&cfg.token);
      api("ping").then(function(r){document.getElementById("cm").textContent=r.ok?"つながりました":"つながりません（URLか合言葉をご確認ください）"});
    };
  }
}
render();
</script>
</body>
</html>
